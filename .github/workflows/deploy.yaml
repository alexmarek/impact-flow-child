name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run prod

      - name: Deploy to Hostinger (placeholder)
        run: |
          # TODO: Configure per-client Hostinger deployment.
          # Replace APP-NAME in the target path and add the required secrets
          # (HOSTINGER_SSH_HOST, HOSTINGER_SSH_USER, HOSTINGER_SSH_KEY).
          echo "Deploy target not configured. Set secrets to enable."
        env:
          TARGET: ${{ secrets.HOSTINGER_TARGET_PATH }}

      # - name: Deploy via rsync
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
      #     chmod 600 ~/.ssh/deploy_key
      #     rsync -rlz --delete \
      #       --no-perms --no-times \
      #       --exclude ".git/" \
      #       --exclude ".github/" \
      #       --exclude "node_modules/" \
      #       --exclude ".gitignore" \
      #       --exclude "package.json" \
      #       --exclude "package-lock.json" \
      #       --exclude "vite.config.js" \
      #       --exclude "*.map" \
      #       -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
      #       ./ "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_TARGET_PATH }}"

  sync_staging:
    name: Back-merge to staging
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into staging
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git fetch origin staging:staging
          git checkout staging
          git merge origin/main --no-edit
          git push origin staging